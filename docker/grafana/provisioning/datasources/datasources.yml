# Auto-provisioned datasources for CognitX Grafana
apiVersion: 1

datasources:
  # Prometheus — metrics from all 5 services
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"      # matches scrape_interval
      httpMethod: POST

  # Alertmanager — the alerts Prometheus fires, as Grafana sees them
  # (Alerting -> Alert groups). Delivery is Alertmanager's, not Grafana's.
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
