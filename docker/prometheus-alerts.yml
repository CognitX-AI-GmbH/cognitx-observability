# Prometheus Alert Rules for CognitX
#
# These rules fire alerts when services degrade.
# Connect Alertmanager or Grafana alerting to receive notifications.

groups:
  - name: service_health
    rules:
      # Service is down (no metrics scraped for 2 minutes)
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for 2 minutes."

      # High error rate (>5% of requests returning 5xx)
      - alert: HighErrorRate
        expr: >
          sum(rate(cognitx_http_requests_total{http_status_code=~"5.."}[5m])) by (service)
          /
          sum(rate(cognitx_http_requests_total[5m])) by (service)
          > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate on {{ $labels.service }}"
          description: "{{ $labels.service }} has >5% error rate (current: {{ $value | humanizePercentage }})."

      # High latency (p95 > 10s for inference, > 2s for other services)
      - alert: HighLatencyInference
        expr: >
          histogram_quantile(0.95, rate(cognitx_http_request_duration_seconds_bucket{service="cognitx-inference"}[5m]))
          > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High inference latency"
          description: "p95 inference latency is {{ $value | humanizeDuration }} (threshold: 10s)."

      - alert: HighLatencyAPI
        expr: >
          histogram_quantile(0.95, rate(cognitx_http_request_duration_seconds_bucket{service!="cognitx-inference"}[5m]))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency on {{ $labels.service }}"
          description: "p95 latency is {{ $value | humanizeDuration }} (threshold: 2s)."

  - name: internal_events
    rules:
      # Internal-event dispatch lag: the oldest undispatched event has been
      # waiting >5m. The listener wakes in <1s and the fallback sweep runs
      # every minute, so 5m means BOTH the listener and the fallback are
      # failing (or dispatch keeps erroring). Backlog is degraded, not lost.
      - alert: InternalEventDispatchLag
        expr: workflow_event_outbox_oldest_pending_age_seconds > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Internal-event outbox dispatch lag on {{ $labels.service }}"
          description: "Oldest pending internal event is {{ $value | humanizeDuration }} old (threshold 5m). Check the outbox listener + fallback sweep."

      # Any dead-lettered event: a row failed dispatch 8x and now needs a
      # manual requeue (runbook). Never expected in steady state, so page.
      - alert: InternalEventDeadLettered
        expr: workflow_event_outbox_dead_total > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Dead-lettered internal event(s) on {{ $labels.service }}"
          description: "{{ $value }} internal-event row(s) are dead-lettered and will not retry. Inspect + requeue per the runbook."

  - name: infrastructure
    rules:
      # Prometheus scrape failures
      - alert: ScrapeFailure
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cannot scrape {{ $labels.job }}"

      # High memory on Prometheus itself
      - alert: PrometheusHighMemory
        expr: process_resident_memory_bytes{job="prometheus"} > 2e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus using >2GB memory"

  # ── DBOS workflow health (WP5) ──────────────────────────────────────
  # Sources: the intelligence /metrics gauges from app/dbos/metrics.py
  # (60s snapshot refresh). Recovery model: DBOS recovers in-flight
  # workflows only for a matching (executor_id, application_version) —
  # see cognitx-core DBOS_RECOVERY_RUNBOOK.md for the levers.
  - name: dbos_workflow_health
    rules:
      # Recovery lag / stranded runs. IMPORTANT: PENDING includes
      # LEGITIMATELY parked approvals and durable waits (up to 30d by
      # design), so age alone cannot prove a strand — hence two tiers and
      # an explicitly investigative summary. The runbook query (PENDING
      # rows grouped by executor_id vs live pods) is the confirmation.
      - alert: DBOSPendingAgeHigh
        expr: dbos_oldest_pending_age_seconds > 86400
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Oldest PENDING DBOS workflow older than 24h"
          description: >-
            May be a legitimately parked approval/wait — confirm owners:
            SELECT executor_id, count(*) FROM dbos.workflow_status WHERE
            status='PENDING' GROUP BY 1, then compare against live pods
            (DBOS_RECOVERY_RUNBOOK.md).
      - alert: DBOSPendingAgeCritical
        expr: dbos_oldest_pending_age_seconds > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "PENDING DBOS workflow older than 8 days — likely stranded"
          description: >-
            Past every default approval timeout; if its executor_id has no
            live pod, re-home via the admin recovery lever
            (DBOS_RECOVERY_RUNBOOK.md).

      # Failure-rate spike over the trailing hour (domain terminal mix).
      - alert: DBOSWorkflowFailureSpike
        expr: >
          sum(workflow_runs_terminal_1h{status=~"failed|timed_out"})
          /
          clamp_min(sum(workflow_runs_terminal_1h), 1)
          > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Workflow failure rate >30% over the last hour"
          description: "{{ $value | humanizePercentage }} of terminal runs failed/timed out."

      # Retention broken: the WP3 daily GC keeps dbos.workflow_status
      # bounded; sustained growth past the cap means the job is dead.
      - alert: DBOSSystemTableUnbounded
        expr: dbos_system_rows_total > 2000000
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "dbos.workflow_status exceeds 2M rows — retention GC not running?"
          description: "Check the dbos_system_retention_gc scheduled task and its logs."

      # The gauges themselves went away: exporter/scheduler/scrape dead.
      # ServiceDown covers a dead pod; this covers a live pod whose
      # metrics refresh stopped (scheduler wedge).
      - alert: DBOSMetricsStale
        expr: absent(dbos_oldest_pending_age_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "DBOS health gauges absent for 15m"
          description: "dbos_metrics_refresh task or the /metrics pipeline is down."

      # C2: the two metering ledgers disagree. cognitx-lite counts every
      # model call it makes; cognitx-serving counts every request it
      # authenticated for the same organization. A sustained gap is
      # either a call one side never recorded or a record the other
      # dropped — and before the nightly reconciliation existed, both
      # looked exactly like nothing at all.
      #
      # 2% is the plan's bar and a healthy pair measures 0. Sustained for
      # 2h so one late-arriving outbox batch does not page anyone.
      - alert: UsageLedgerDrift
        expr: max_over_time(usage_reconciliation_drift_ratio[2h]) > 0.02
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Metering ledgers disagree by {{ $value | humanizePercentage }} on {{ $labels.model }}"
          description: "cognitx-lite's usage_events and cognitx-serving's usage_record disagree for this model. Read the usage_reconciliation audit row for the per-model counts."

      # The comparison could not be made at all — serving unreachable,
      # the door refused, or the job never ran. A reconciliation that
      # silently stops running is worse than one that reports drift.
      - alert: UsageReconciliationUnavailable
        expr: increase(usage_reconciliation_unavailable_total[25h]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Usage reconciliation could not read serving's ledger"
          description: "The nightly comparison returned UNKNOWN, not clean. Check cognitx-serving's /v1/usage/by-model and the intelligence job log."
